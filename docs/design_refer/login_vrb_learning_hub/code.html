<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="badge">badge</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-border-subtle rounded-DEFAULT bg-surface-container-lowest text-on-surface placeholder-outline-variant focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200 outline-none font-body-md text-body-md" id="employee_code" name="employee_code" placeholder="e.g. VRB12345" required="" type="text">
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>

</button>
